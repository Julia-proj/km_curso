<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HAIRLAB favicon: HL monogram. Letters drawn as rects so they render
       identically in every browser tab (no web-font dependency). -->
  <rect width="100" height="100" rx="22" fill="#9C544E"/>
  <g fill="#FBF8F2">
    <!-- H -->
    <rect x="22" y="30" width="8" height="40"/>
    <rect x="42" y="30" width="8" height="40"/>
    <rect x="22" y="46" width="28" height="8"/>
    <!-- L -->
    <rect x="60" y="30" width="8" height="40"/>
    <rect x="60" y="62" width="22" height="8"/>
  </g>
</svg>
